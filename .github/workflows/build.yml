name: Build Pro Flight Sim APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Pro Flight Sim Project Structure
      run: |
        mkdir -p app/src/main/java/com/flypro/game/data
        mkdir -p app/src/main/java/com/flypro/game/physics
        mkdir -p app/src/main/java/com/flypro/game/ui/components
        mkdir -p app/src/main/java/com/flypro/game/ui/screens
        mkdir -p app/src/main/java/com/flypro/game/theme
        mkdir -p app/src/main/res/values

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FlyProSim"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.20" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.flypro.game"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.flypro.game"
                minSdk = 24
                targetSdk = 34
                versionCode = 2
                versionName = "2.0"
                vectorDrawables { useSupportLibrary = true }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.4" }
            packaging { resources { excludes += "/META-INF/{AL2.0}/{LGPL2.1}" } }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2023.10.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.navigation:navigation-compose:2.7.6")
            implementation("com.google.code.gson:gson:2.10.1")
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.FlyPro" parent="android:Theme.Material.Light.NoActionBar">
            </style>
        </resources>
        EOF

