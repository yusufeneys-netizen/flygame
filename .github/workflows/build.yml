name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Simple Android App
      run: |
        mkdir -p app/src/main/java/com/test/game
        mkdir -p app/src/main/res/values

        # build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:7.4.2"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # settings.gradle
        echo "include(':app')" > settings.gradle

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            compileSdk 33
            defaultConfig {
                applicationId "com.test.game"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.test.game">
            <application
                android:label="FlyPro Test"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/test/game/MainActivity.kt
        package com.test.game
        import android.os.Bundle
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val text = TextView(this)
                text.text = "FlyPro Calisiyor! Ilk APK Basarili."
                text.textSize = 22f
                setContentView(text)
            }
        }
        EOF

    - name: Download Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlyPro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
