        cat << 'EOF' > app/src/main/java/com/flypro/game/FlyProApp.kt
        package com.flypro.game
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.platform.LocalContext
        import androidx.navigation.compose.NavHost
        import androidx.navigation.compose.composable
        import androidx.navigation.compose.rememberNavController
        import com.flypro.game.data.SaveManager
        import com.flypro.game.ui.screens.*
        @Composable
        fun FlyProApp() {
            val navController = rememberNavController()
            val context = LocalContext.current
            val saveManager = SaveManager(context)
            NavHost(navController = navController, startDestination = "menu") {
                composable("menu") {
                    MainMenuScreen(
                        onPlayClick = { navController.navigate("flight_setup") },
                        onHangarClick = { navController.navigate("hangar") },
                        onSettingsClick = { navController.navigate("settings") }
                    )
                }
                composable("hangar") { HangarScreen(saveManager = saveManager, onBack = { navController.popBackStack() }) }
                composable("flight_setup") {
                    FlightSetupScreen(
                        onStartFlight = { dep, dest -> navController.navigate("game/$dep/$dest") },
                        onBack = { navController.popBackStack() }
                    )
                }
                composable("game/{departure}/{destination}") { backStackEntry ->
                    val departure = backStackEntry.arguments?.getString("departure") ?: "BER"
                    val destination = backStackEntry.arguments?.getString("destination") ?: "FRA"
                    GameScreen(saveManager = saveManager, departure = departure, destination = destination, onExit = { navController.popBackStack("menu", inclusive = false) })
                }
                composable("settings") { SettingsScreen(onBack = { navController.popBackStack() }) }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/flypro/game/MainActivity.kt
        package com.flypro.game
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import com.flypro.game.theme.FlyProTheme
        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    FlyProTheme { FlyProApp() }
                }
            }
        }
        EOF

    - name: Download Gradle 8.5 Manually
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        sudo mv gradle-8.5 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Initialize Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlyPro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
