        cat << 'EOF' > app/src/main/java/com/flypro/game/data/SaveManager.kt
        package com.flypro.game.data
        import android.content.Context
        import android.content.SharedPreferences
        class SaveManager(context: Context) {
            private val prefs: SharedPreferences = context.getSharedPreferences("FlyProSimPrefs", Context.MODE_PRIVATE)
            fun getMoney(): Int = prefs.getInt("money", 10000)
            fun saveMoney(money: Int) = prefs.edit().putInt("money", money).apply()
            fun getSelectedAircraftId(): String = prefs.getString("selected_aircraft", "cessna172") ?: "cessna172"
            fun saveSelectedAircraftId(id: String) = prefs.edit().putString("selected_aircraft", id).apply()
            fun isAircraftUnlocked(id: String): Boolean {
                if (id == "cessna172") return true
                return prefs.getBoolean("unlocked_$id", false)
            }
            fun unlockAircraft(id: String) = prefs.edit().putBoolean("unlocked_$id", true).apply()
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/flypro/game/physics/FlightPhysics.kt
        package com.flypro.game.physics
        import com.flypro.game.data.Aircraft
        import kotlin.math.abs

        class FlightPhysics(val aircraft: Aircraft, val cargoWeight: Float) {
            var posX = 0f
            var posY = 2000f // Başlangıç irtifası (feet)
            var airspeed = 80f // Knot
            var verticalSpeed = 0f // Feet per minute
            var pitch = 2f // Derece
            var throttle = 60f // Yüzde
            var flaps = 0 // 0, 1, 2
            var gearDown = true
            val totalWeight = aircraft.baseWeight + cargoWeight
            var fuel = aircraft.fuelCapacity
            
            var isStalled = false
            var isOverspeed = false
            var isGrounded = false
            var landingScore = -1f

            fun update(dt: Float) {
                if (fuel <= 0f) {
                    throttle = 0f
                }

                // İtme ve Direnç Hesaplamaları (Gerçekçi Fizik)
                val thrust = (throttle / 100f) * aircraft.enginePower * 3.0f
                val dragFactor = 0.002f + (if (gearDown) 0.0015f else 0f) + (flaps * 0.001f)
                val drag = airspeed * airspeed * dragFactor
                
                val weightEffect = totalWeight / 2000f
                val netAcceleration = (thrust - drag) / weightEffect
                
                airspeed += netAcceleration * dt
                if (airspeed < 0f) airspeed = 0f

                // Stall ve Aşırı Hız Kontrolü
                isStalled = airspeed < aircraft.stallSpeed && posY > 15f
                isOverspeed = airspeed > aircraft.maxSpeed

                if (isStalled) {
                    verticalSpeed = -1200f
                    pitch = -10f
                } else {
                    // Pitch ve hücum açısına göre dikey hız
                    val lift = (airspeed * 0.8f) - (weightEffect * 5f)
                    verticalSpeed = (pitch * 25f) + (lift - 50f)
                }

                posY += verticalSpeed * (dt / 60f)

                // Yere İniş Kontrolü
                if (posY <= 10f) {
                    posY = 0f
                    isGrounded = true
                    val touchdownVS = abs(verticalSpeed)
                    if (landingScore < 0f) {
                        landingScore = when {
                            touchdownVS < 150f -> 100f // Mükemmel iniş
                            touchdownVS < 350f -> 75f  // Normal iniş
                            touchdownVS < 600f -> 40f  // Sert iniş
                            else -> 10f                // Kaza / Hasar
                        }
                    }
                    verticalSpeed = 0f
                    pitch = 0f
                    airspeed = maxOf(0f, airspeed - 20f * dt)
                } else {
                    isGrounded = false
                }

                // Yakıt Tüketimi
                if (throttle > 0f && !isGrounded) {
                    fuel -= (throttle / 100f) * 0.3f * dt
                    if (fuel < 0f) fuel = 0f
                }

                // Yatay İlerleme (Mesafe)
                if (!isGrounded || airspeed > 20f) {
                    posX += airspeed * dt * 1.2f
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/flypro/game/ui/components/FlightInstruments.kt
        package com.flypro.game.ui.components
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.layout.fillMaxSize
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.drawscope.rotate
        import androidx.compose.ui.graphics.drawscope.Stroke

        @Composable
        fun FlightWorldCanvas(posX: Float, posY: Float, pitch: Float, isGrounded: Boolean) {
            Canvas(modifier = Modifier.fillMaxSize()) {
                // Gökyüzü ve Atmosfer Gradyanı
                drawRect(color = Color(0xFF0d47a1))

                val groundY = size.height * 0.75f
                // Çim / Zemin
                drawRect(color = Color(0xFF2e7d32), topLeft = Offset(0f, groundY), size = androidx.compose.ui.geometry.Size(size.width, size.height - groundY))
                
                // Pist Çizgileri (Görsel Zenginlik)
                if (posX in 3000f..10000f) {
                    drawRect(color = Color.DarkGray, topLeft = Offset(0f, groundY - 5f), size = androidx.compose.ui.geometry.Size(size.width, 10f))
                    drawRect(color = Color.White, topLeft = Offset(size.width / 2f - 40f, groundY - 2f), size = androidx.compose.ui.geometry.Size(80f, 4f))
                }

                // Uçak Temsili Çizimi (Yapay Ufuk ve Uçak)
                val planeCenter = Offset(size.width / 2f, groundY - (posY * 0.15f).coerceIn(0f, groundY - 80f))
                
                rotate(pitch, pivot = planeCenter) {
                    // Gövde
                    drawRect(color = Color.LightGray, topLeft = Offset(planeCenter.x - 35f, planeCenter.y - 6f), size = androidx.compose.ui.geometry.Size(70f, 12f))
                    // Kanat
                    drawRect(color = Color.White, topLeft = Offset(planeCenter.x - 10f, planeCenter.y - 25f), size = androidx.compose.ui.geometry.Size(20f, 50f))
                    // Burun
                    drawCircle(color = Color.Red, radius: 8f, center = Offset(planeCenter.x + 35f, planeCenter.y))
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/flypro/game/ui/screens/MainMenuScreen.kt
