        cat << 'EOF' > app/src/main/java/com/flypro/game/ui/screens/GameScreen.kt
        package com.flypro.game.ui.screens
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import com.flypro.game.data.GameDatabase
        import com.flypro.game.data.SaveManager
        import com.flypro.game.physics.FlightPhysics
        import com.flypro.game.ui.components.FlightWorldCanvas
        import kotlinx.coroutines.delay

        @Composable
        fun GameScreen(saveManager: SaveManager, departure: String, destination: String, cargo: Float, onExit: () -> Unit) {
            val aircraftId = saveManager.getSelectedAircraftId()
            val aircraft = GameDatabase.aircraftList.find { it.id == aircraftId } ?: GameDatabase.aircraftList[0]
            val physics = remember { FlightPhysics(aircraft, cargo) }
            
            var missionEnded by remember { mutableStateOf(false) }

            LaunchedEffect(Unit) {
                while (!missionEnded) {
                    delay(40L)
                    physics.update(0.04f)
                    if (physics.isGrounded && physics.airspeed <= 1f) {
                        missionEnded = true
                        val reward = (physics.landingScore * 10f).toInt() + 500
                        saveManager.saveMoney(saveManager.getMoney() + reward)
                    }
                }
            }

            Column(modifier = Modifier.fillMaxSize()) {
                // Üst Ekran: Uçuş Grafikleri ve Kokpit Görünümü
                Box(modifier = Modifier.fillMaxWidth().weight(0.6f)) {
                    FlightWorldCanvas(posX = physics.posX, posY = physics.posY, pitch = physics.pitch, isGrounded = physics.isGrounded)
                    
                    Column(modifier = Modifier.padding(16.dp)) {
                        Text("ROUTE: $departure ➔ $destination", color = Color.White, fontSize = 13.sp)
                        Text("ALTITUDE: ${physics.posY.toInt()} FT", color = Color.Cyan, fontSize = 15.sp)
                        Text("AIRSPEED: ${physics.airspeed.toInt()} KTS", color = Color.Cyan, fontSize = 15.sp)
                        Text("VERT SPEED: ${physics.verticalSpeed.toInt()} FPM", color = Color.Yellow, fontSize = 13.sp)
                        Text("FUEL: ${physics.fuel.toInt()} L", color = Color.Green, fontSize = 13.sp)
                        
                        if (physics.isStalled) {
                            Spacer(modifier = Modifier.height(10.dp))
                            Text("⚠️ STALL WARNING! PITCH DOWN!", color = Color.Red, fontSize = 18.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.Bold)
                        }
                    }

                    Button(onClick = onExit, modifier = Modifier.align(Alignment.TopEnd).padding(16.dp), colors = ButtonDefaults.buttonColors(containerColor = Color.Red)) {
                        Text("Abort Flight")
                    }

                    if (missionEnded) {
                        Surface(modifier = Modifier.align(Alignment.Center), color = Color.Black.copy(alpha = 0.8f)) {
                            Column(modifier = Modifier.padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                Text("FLIGHT COMPLETED", color = Color.Green, fontSize = 22.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.Bold)
                                Text("Landing Score: ${physics.landingScore.toInt()} / 100", color = Color.White, fontSize = 16.sp)
                                Spacer(modifier = Modifier.height(16.dp))
                                Button(onClick = onExit) { Text("Return to Hangar") }
                            }
                        }
                    }
                }

                // Alt Ekran: Profesyonel Pilot Kontrolleri
                Surface(modifier = Modifier.fillMaxWidth().weight(0.4f), color = Color(0xFF111827)) {
                    Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.SpaceAround) {
                        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                            Text("Throttle: ${physics.throttle.toInt()}%", color = Color.White, fontSize = 13.sp)
                            Text("Pitch: ${physics.pitch.toInt()}°", color = Color.White, fontSize = 13.sp)
                            Text("Flaps: Level ${physics.flaps}", color = Color.White, fontSize = 13.sp)
                            Text("Gear: ${if(physics.gearDown) "DOWN" else "UP"}", color = Color.White, fontSize = 13.sp)
                        }
                        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                            Button(onClick = { if (physics.throttle < 100f) physics.throttle += 10f }) { Text("THR +") }
                            Button(onClick = { if (physics.throttle > 0f) physics.throttle -= 10f }) { Text("THR -") }
                            Button(onClick = { physics.pitch += 1.5f }) { Text("PITCH UP") }
                            Button(onClick = { physics.pitch -= 1.5f }) { Text("PITCH DOWN") }
                            Button(onClick = { physics.flaps = (physics.flaps + 1) % 3 }) { Text("FLAPS") }
                            Button(onClick = { physics.gearDown = !physics.gearDown }) { Text("GEAR") }
                        }
                    }
                }
            }
        }
        EOF

